name: "1. Watch Twitch & Generate Cuts (24/7)"

on:
  schedule:
    # Roda automaticamente a cada 15 minutos, 24 horas por dia, 7 dias por semana
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      profile:
        description: "Filtrar perfil específico (opcional)"
        required: false
        default: ""
      max_cuts:
        description: "Máximo de cortes nesta execução (opcional)"
        required: false
        default: ""

concurrency:
  group: watch-and-clip-loop
  cancel-in-progress: false

jobs:
  watch-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Deno (required by yt-dlp YouTube EJS)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install FFmpeg & Fonts
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-liberation fonts-dejavu-core fontconfig
          fc-cache -fv

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Dual-Mode Twitch Watcher & Renderer
        env:
          AUTOCLIPPER_PROFILES_JSON: ${{ secrets.AUTOCLIPPER_PROFILES_JSON }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GDRIVE_TOKEN_JSON: ${{ secrets.GDRIVE_TOKEN_JSON }}
          GDRIVE_ROOT_FOLDER_NAME: ${{ secrets.GDRIVE_ROOT_FOLDER_NAME || vars.GDRIVE_ROOT_FOLDER_NAME || 'TwitchAutoClipper' }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          DISCORD_RELAY_URL: ${{ secrets.DISCORD_RELAY_URL }}
          DISCORD_RELAY_TOKEN: ${{ secrets.DISCORD_RELAY_TOKEN }}
          DISCORD_RELAY_TENANT: ${{ secrets.DISCORD_RELAY_TENANT }}
          YOUTUBE_COOKIES_TXT: ${{ secrets.YOUTUBE_COOKIES_TXT }}
        run: |
          ARGS=("watch")
          if [ -n "${{ inputs.profile }}" ]; then
            ARGS+=("--profile" "${{ inputs.profile }}")
          fi
          if [ -n "${{ inputs.max_cuts }}" ]; then
            ARGS+=("--max-cuts" "${{ inputs.max_cuts }}")
          fi
          python -m src.main "${ARGS[@]}"
