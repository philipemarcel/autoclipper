name: "2. Smart Drip Queue Publisher (24/7)"

on:
  schedule:
    # Verifica a cada 20 minutos se há cortes aprovados cujo horário agendado já chegou
    - cron: "5,25,45 * * * *"
  workflow_dispatch:
    inputs:
      force_immediate:
        description: "Forçar publicação imediata do próximo corte pendente (true/false)"
        required: false
        default: "false"

concurrency:
  group: drip-publisher-loop
  cancel-in-progress: false

jobs:
  drip-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Publish Due Cuts from Smart Drip Queue
        env:
          AUTOCLIPPER_PROFILES_JSON: ${{ secrets.AUTOCLIPPER_PROFILES_JSON }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GDRIVE_TOKEN_JSON: ${{ secrets.GDRIVE_TOKEN_JSON }}
          GDRIVE_ROOT_FOLDER_NAME: ${{ secrets.GDRIVE_ROOT_FOLDER_NAME || vars.GDRIVE_ROOT_FOLDER_NAME || 'TwitchAutoClipper' }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          DISCORD_RELAY_URL: ${{ secrets.DISCORD_RELAY_URL }}
          DISCORD_RELAY_TOKEN: ${{ secrets.DISCORD_RELAY_TOKEN }}
          DISCORD_RELAY_TENANT: ${{ secrets.DISCORD_RELAY_TENANT }}
          IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          ARGS=("drip-publish")
          if [ "${{ inputs.force_immediate }}" = "true" ]; then
            ARGS+=("--force")
          fi
          python -m src.main "${ARGS[@]}"
