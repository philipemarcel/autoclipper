name: "2. Smart Drip Queue Publisher (24/7)"

on:
  schedule:
    # Verifica a cada 20 minutos se há cortes aprovados cujo horário agendado já chegou
    - cron: "5,25,45 * * * *"
  workflow_dispatch:

concurrency:
  group: twitch-autocliper-state-sync
  cancel-in-progress: false

jobs:
  drip-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Publish Due Cuts from Smart Drip Queue
        env:
          GDRIVE_TOKEN_JSON: ${{ secrets.GDRIVE_TOKEN_JSON }}
          GDRIVE_ROOT_FOLDER_NAME: ${{ vars.GDRIVE_ROOT_FOLDER_NAME || 'TwitchAutoClipper' }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
        run: |
          python -m src.main drip-publish
