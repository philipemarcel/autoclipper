name: "3. Discord 1-Click Button & /cortar Handler"

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Ação (approve_both, now_both, approve_reels, approve_tiktok, now_tiktok, clean_audio, reject, youtube_cut)"
        required: true
      cut_id:
        description: "ID único do corte"
        required: false
        default: ""
      discord_message_id:
        description: "ID da mensagem no Discord"
        required: false
        default: ""
      youtube_url:
        description: "URL do vídeo ou live do YouTube (para /cortar)"
        required: false
        default: ""
      max_cuts:
        description: "Quantidade de cortes do YouTube (1 a 10)"
        required: false
        default: "3"
      time_range:
        description: "Trecho opcional (ex: 12:30-15:00)"
        required: false
        default: ""
      actor:
        description: "Usuário que disparou no Discord"
        required: false
        default: ""

concurrency:
  group: discord-action-${{ inputs.action }}-${{ inputs.cut_id }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  handle-button:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Deno (required by yt-dlp YouTube EJS)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install FFmpeg & Fonts
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-liberation fonts-dejavu-core fontconfig
          fc-cache -fv

      - name: Install Python dependencies (+ Demucs only when cleaning music)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ "${{ inputs.action }}" = "clean_audio" ]; then
            pip install demucs torch torchaudio --index-url https://download.pytorch.org/whl/cpu
            pip install demucs
          fi

      - name: Execute Discord Button or /cortar Command
        env:
          AUTOCLIPPER_PROFILES_JSON: ${{ secrets.AUTOCLIPPER_PROFILES_JSON }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GDRIVE_TOKEN_JSON: ${{ secrets.GDRIVE_TOKEN_JSON }}
          GDRIVE_ROOT_FOLDER_NAME: ${{ secrets.GDRIVE_ROOT_FOLDER_NAME || vars.GDRIVE_ROOT_FOLDER_NAME || 'TwitchAutoClipper' }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          DISCORD_RELAY_URL: ${{ secrets.DISCORD_RELAY_URL }}
          DISCORD_RELAY_TOKEN: ${{ secrets.DISCORD_RELAY_TOKEN }}
          DISCORD_RELAY_TENANT: ${{ secrets.DISCORD_RELAY_TENANT }}
          YOUTUBE_COOKIES_TXT: ${{ secrets.YOUTUBE_COOKIES_TXT }}
          IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          python -m src.main discord-action \
            --action "${{ inputs.action }}" \
            --cut-id "${{ inputs.cut_id }}" \
            --message-id "${{ inputs.discord_message_id }}" \
            --url "${{ inputs.youtube_url }}" \
            --max-cuts "${{ inputs.max_cuts || '3' }}" \
            --time-range "${{ inputs.time_range }}"
