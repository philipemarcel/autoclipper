name: "3. Discord 1-Click Button Handler"

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Ação clicada no Discord (approve_both, now_both, approve_reels, approve_tiktok, clean_audio, reject)"
        required: true
      cut_id:
        description: "ID único do corte"
        required: true
      discord_message_id:
        description: "ID da mensagem no Discord"
        required: false
        default: ""
      actor:
        description: "Usuário que clicou no botão"
        required: false
        default: ""

concurrency:
  group: twitch-autocliper-state-sync
  cancel-in-progress: false

jobs:
  handle-button:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install FFmpeg
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies (+ Demucs only when cleaning music)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ "${{ inputs.action }}" = "clean_audio" ]; then
            pip install demucs torch torchaudio --index-url https://download.pytorch.org/whl/cpu
            pip install demucs
          fi

      - name: Execute Discord Button Action
        env:
          GDRIVE_TOKEN_JSON: ${{ secrets.GDRIVE_TOKEN_JSON }}
          GDRIVE_ROOT_FOLDER_NAME: ${{ vars.GDRIVE_ROOT_FOLDER_NAME || 'TwitchAutoClipper' }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
        run: |
          python -m src.main discord-action \
            --action "${{ inputs.action }}" \
            --cut-id "${{ inputs.cut_id }}" \
            --message-id "${{ inputs.discord_message_id }}"
